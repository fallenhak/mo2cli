[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mo2cli"
version = "0.4.0"
description = "A safe, scriptable CLI for Mod Organizer 2 profiles and mod lists"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "mo2cli contributors"}]
keywords = ["mod-organizer-2", "mo2", "modding", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = ["py7zr>=0.22"]

[project.urls]
Homepage = "https://github.com/fallenhak/mo2cli"
Repository = "https://github.com/fallenhak/mo2cli.git"
Issues = "https://github.com/fallenhak/mo2cli/issues"

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["build>=1.2", "pip-audit>=2.7", "ruff>=0.9", "twine>=6"]

[project.scripts]
mo2 = "mo2cli.cli:main"

[tool.setuptools.packages.find]
include = ["mo2cli*"]
